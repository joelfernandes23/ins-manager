name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore InsManager.sln

      - name: Test
        run: dotnet test InsManager.sln --configuration Release --no-restore

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1 ${{ needs.release-please.outputs.version }}

      - name: Attach package to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem artifacts/release -File |
            Where-Object Extension -In '.zip', '.sha256' |
            ForEach-Object FullName
          gh release upload '${{ needs.release-please.outputs.tag_name }}' @assets --clobber
