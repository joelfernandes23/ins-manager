name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore InsManager.sln

      - name: Verify formatting
        run: dotnet format InsManager.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build InsManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InsManager.sln --configuration Release --no-build

      - name: Package release candidate
        if: github.ref == 'refs/heads/release'
        shell: pwsh
        run: .\scripts\package.ps1 1.0.0

      - name: Upload release candidate
        if: github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@v7
        with:
          name: INS-Manager-1.0.0-win-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error
          retention-days: 14
